<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка Elemental Duel PWA</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .installer {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        .step {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
        }
        .step-number {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: #4ecdc4;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 10px;
        }
        button {
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
        .qr {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            display: inline-block;
        }
        @media (max-width: 600px) {
            .installer { padding: 20px; }
            .step { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="installer">
        <h1>⚔️ Elemental Duel ⚔️</h1>
        <p>Установите игру как приложение на телефон</p>
        
        <div class="step">
            <span class="step-number">1</span> Откройте Chrome / Safari
        </div>
        <div class="step">
            <span class="step-number">2</span> Нажмите на меню <strong>⋮</strong> (три точки)
        </div>
        <div class="step">
            <span class="step-number">3</span> Выберите <strong>"Установить приложение"</strong>
        </div>
        <div class="step">
            <span class="step-number">4</span> Нажмите <strong>"Установить"</strong>
        </div>
        
        <button onclick="window.location.href='index.html'">🎮 ИГРАТЬ СЕЙЧАС</button>
        
        <div style="margin-top: 20px; font-size: 0.8em; opacity: 0.7;">
            Игра работает офлайн после первого запуска
        </div>
    </div>
</body>
</html>
